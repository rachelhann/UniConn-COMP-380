<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" th:href="@{/vector-logos/unicornLogo.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/css/forgotPassword.css}">
    <title>Forgot Password - UniConn</title>
</head>

<body>
<nav class="navbar">
    <img th:src="@{/vector-logos/unicornLogo.png}" alt="UniConn Logo" width="100">
    <a th:href="@{/login}" class="main">UniConn</a>
</nav><hr><br><br>

<div class="login-container">

    <!-- Step 1: Enter email -->
    <form id="step1-form">
        <div class="header">
            <h3>Forgot Password</h3>
        </div>
        <div class="input-box">
            <img class="icon" th:src="@{/vector-logos/emailLogo.svg}">
            <input type="email" id="forgot-email" required placeholder=" ">
            <label>Email</label>
        </div>
        <button type="submit">Continue</button>
        <p id="step1-message" class="forgot-message" style="display:none"></p>
        <div class="login-link">
            <p>Return to <a href="/login">login</a></p>
        </div>
    </form>

    <!-- Step 2: Answer security question + new password -->
    <form id="step2-form" style="display:none">
        <div class="header">
            <h3>Reset Password</h3>
        </div>
        <p id="security-question" class="security-question"></p>
        <div class="input-box">
            <input type="text" id="security-answer" required placeholder=" ">
            <label>Your Answer</label>
        </div>
        <div class="input-box">
            <input type="password" id="new-password" required placeholder=" ">
            <label>New Password</label>
        </div>
        <div class="input-box">
            <input type="password" id="confirm-password" required placeholder=" ">
            <label>Confirm New Password</label>
        </div>
        <button type="submit">Reset Password</button>
        <p id="step2-message" class="forgot-message" style="display:none"></p>
        <div class="login-link">
            <p>Return to <a href="/login">login</a></p>
        </div>
    </form>

</div>

<script th:src="@{/js/forgotPassword.js}" defer></script>
</body>

</html>
