<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" th:href="@{/vector-logos/unicornLogo.png}" type="image/png">
  <link rel="stylesheet" th:href="@{/css/register.css}">
  <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
  <title>Register - UniConn</title>
</head>

<body>
<!--navigation bar-->
<nav class="navbar">
  <img class="logo-icon" th:src="@{/vector-logos/unicornLogo.png}" alt="UniConn Logo">
  <a th:href="@{/login}" class="main">UniConn</a>
  <button id="dark-mode-toggle" class="dark-mode-btn" style="margin-left:auto" title="Toggle dark mode">🌙</button>
</nav><hr><br><br>

<div class="login-container">
  <form id="register-form">

    <div class="header">
      <h3>Sign Up</h3>
    </div>

    <div class="input-box">
      <img class="icon" th:src="@{/vector-logos/usernameSignIn.svg}">
      <input type="text" name="username" required placeholder=" ">
      <label>Username</label>
    </div>

    <div class="input-box">
      <img class="icon" th:src="@{/vector-logos/emailLogo.svg}">
      <input type="email" name="email" required placeholder=" ">
      <label>Email</label>
    </div>

    <div class="input-box">
      <img class="icon" th:src="@{/vector-logos/passwordSignIn.svg}">
      <input type="password" name="password" required placeholder=" ">
      <label>Password</label>
      <button type="button" class="password-toggle" aria-label="Toggle password visibility"></button>
    </div>

    <div class="input-box">
      <select name="secretQuestion" required>
        <option value="" disabled selected>Select a security question</option>
        <option value="What was the name of your first pet?">What was the name of your first pet?</option>
        <option value="What city were you born in?">What city were you born in?</option>
        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
        <option value="What was the name of your elementary school?">What was the name of your elementary school?</option>
        <option value="What was the make of your first car?">What was the make of your first car?</option>
      </select>
    </div>

    <div class="input-box">
      <input type="text" name="secretAnswer" required placeholder=" ">
      <label>Security Answer</label>
    </div>

    <p id="register-error" style="color:#e05c5c;font-size:0.9em;min-height:1.4em"></p>
    <button type="submit">Register</button>

    <div class="login-link">
      <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>

  </form>

  <script th:src="@{/js/darkMode.js}" defer></script>
  <script th:src="@{/js/passwordToggle.js}" defer></script>
  <script th:src="@{/js/register.js}" defer></script>
</div>

</body>

</html></html>
